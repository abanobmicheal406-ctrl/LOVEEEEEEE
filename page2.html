    <style>
        /* 1. الخلفية الملونة والخط الجديد */
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Cairo Play', cursive;
            text-align: center;
            padding: 50px;
            overflow: hidden;
            position: relative;
        }
        h1 {
            color: #832e5f;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
        }
        p {
            color: #4b0082;
            font-size: 1.2em;
        }

        /* 2. تصميم وإنيميشن القلوب المتحركة العادي */
        .heart-background {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #ff69b4;
            transform: rotate(-45deg);
            z-index: -1;
            animation: float-up 10s infinite linear;
            opacity: 0;
            box-shadow: 0 0 5px rgba(255, 105, 180, 0.8);
        }
        .heart-background:before, .heart-background:after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #ff69b4;
            border-radius: 50%;
        }
        .heart-background:before { top: -7.5px; left: 0; }
        .heart-background:after { left: 7.5px; top: 0; }

        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(-45deg); opacity: 0.5; }
            100% { transform: translateY(-100px) rotate(-45deg); opacity: 0; }
        }

        .heart-background:nth-child(1) { left: 10%; animation-delay: 0s; }
        .heart-background:nth-child(2) { left: 20%; animation-delay: 2s; width: 10px; height: 10px; }
        .heart-background:nth-child(3) { left: 35%; animation-delay: 4s; }
        .heart-background:nth-child(4) { left: 50%; animation-delay: 1s; width: 20px; height: 20px; }
        .heart-background:nth-child(5) { left: 65%; animation-delay: 3s; }
        .heart-background:nth-child(6) { left: 80%; animation-delay: 5s; width: 12px; height: 12px; }

        /* تعديل النص الدوار ليصبح قلباً يدور وبه صورة */
        .rotating-heart {
            width: 100px;
            height: 100px;
            background-color: #d11e3b; /* لون أحمر احتياطي */
            background-image: url("photo7.jpg"); /* <== هنا ضع رابط صورتك */
            background-size: cover;
            background-position: center;
            margin: 50px auto;
            position: relative;
            animation: spin 3s linear infinite;
            transform: rotate(-45deg);
            box-shadow: 0 0 15px rgba(209, 30, 59, 0.7);
            z-index: 1; /* لجعل القلب فوق القلوب الخلفية */
        }

        /* إنشاء أجزاء القلب العلوية مع الصورة أيضاً */
        .rotating-heart:before,
        .rotating-heart:after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #d11e3b; /* لون أحمر احتياطي */
            background-image: url("photo7.jpg"); /* <== هنا ضع رابط صورتك أيضاً */
            background-size: cover;
            background-position: center;
            border-radius: 100%;
        }
        .rotating-heart:before {
            top: -50px;
            left: 0;
            background-position: center -25px; /* مثال: تحريك الصورة للأعلى قليلاً */
        }
        .rotating-heart:after {
            left: 50px;
            top: 0;
            background-position: center -25px; /* مثال: تحريك الصورة للأعلى قليلاً */
        }

        /* تعريف الحركة (keyframes) للدوران */
        @keyframes spin {
            0% { transform: rotate(-45deg); }
            100% { transform: rotate(315deg); }
        }
        a {
            color: #6a0dad;
            font-weight: bold;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid #6a0dad;
            border-radius: 20px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #51071c;
            color: white;
        }
    </style>
</head>
